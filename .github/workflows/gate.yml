# 門禁：GitHub Actions 上跑**全量**。
#
# ★ ★ ★ **這裡只有一條命令，而且與本機那條逐字相同**：`bash tests/m0/docker-run.sh`。
#   這不是省事，是判據紀律：CI 若自己拼一套「等價的」步驟，就會長出**第二套判據**，
#   而兩套判據遲早分家 —— 那時「CI 綠」與「門禁綠」是兩件事，卻沒有任何東西會說出來。
#
# ⚠ ⚠ **有意不寫 `paths-ignore`。** `crates/fulcrum-config/tests/doc_contract.rs` 用
#   `include_str!` 讀 `docs/architecture/dsl-reference.md`，`supply_gates.rs` 讀根
#   `Cargo.toml`/`Cargo.lock`，還有一道門反向斷言**已串接的能力不許出現在 `dsl-reference.md` 裡**
#   ⇒ **一次純文件改動是真的能把門禁弄紅的**，跳過它等於把這類缺陷放行，而現象是「CI 一直綠」。
#
# 兩條止血閥：`concurrency` + `cancel-in-progress`（連著推幾次時只有最後一次跑到底）、
# `timeout-minutes`（卡死的任務最多燒這麼多，而不是預設的 6 小時）。
name: gate

on:
  # ★ 只在 main 上跑：口徑是「直接提交 main，不開分支不開 PR」。
  push:
    branches: [main]
  # 手動觸發，用於改完 workflow 自身之後重跑。
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # ★ 釘住大版本，不用 `ubuntu-latest`：M1 的 systemd 場景依賴宿主機是 **cgroup v2**，
    #   而 `ubuntu-latest` 換代時不會有任何一行輸出告訴我們環境變了。
    runs-on: ubuntu-24.04
    # ⚠ 這個上限是**止血閥**，不是預期耗時；真實耗時見每次執行的記錄。
    timeout-minutes: 120

    steps:
      # ── ★ 這幾個 action 的大版本 = 它們跑在哪個 Node 上 ─────────────────────
      #
      # ⚠ ⚠ **本工作流裡選不了 Node 版本，也沒有一行 Node**：判據是
      #   `bash tests/m0/docker-run.sh`，全在容器裡跑 Rust。Node 只是 GitHub 這幾個
      #   JS action 自己的執行環境，版本寫在**它們的** `action.yml` 的 `runs.using` 裡。
      #   ⇒ 看見「Node.js 20 is deprecated」時要動的是**這裡的大版本**，
      #   而不是去找一個「把 CI 換成 node24 / node26」的開關 —— 那個開關不存在。
      #   （`actions/setup-node` 是給專案程式碼用的，本儲存庫沒有 Node 程式碼，不需要它。）
      #
      # ★ 升到 v7 / v6 / v7 之前逐條讀過發佈說明，對**本工作流的用法**都不是破壞性改動：
      #   checkout v7 只多攔 `pull_request_target` / `workflow_run` 的 fork 檢出（兩者都沒用），
      #   upload-artifact v7 新增的 `archive` 預設 true 就是舊行為，cache v6 只是 ESM 化。
      # ⚠ 硬前提是 **runner ≥ 2.327.1**；GitHub 託管的 `ubuntu-24.04` 恆滿足，
      #   哪天換成自託管 runner 要先確認這一條。
      - uses: actions/checkout@v7

      # ★ runner 上 `/` 只有二十幾 GB 空餘，而這裡要放：建置鏡像、systemd 測試鏡像、
      #   cargo registry、release 模式的整個 target。⚠ 磁碟滿的回報錯誤形態五花八門
      #   （連結器 OOM、docker 寫層失敗），而沒有一條會說「磁碟滿了」。
      - name: 腾出磁盘
        run: |
          echo "── 清理前 ──"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          echo "── 清理后 ──"; df -h /

      # ★ 每次都把環境打出來。§8 要求可重現，而可重現的第一步是**看得見跑的是什麼**。
      #   ⚠ cgroup 那一行是判據相關的：M1 的 `ExitType=cgroup` 要求容器側 systemd ≥ 250
      #   且宿主機是 cgroup v2 統一層級。它變成 v1 的那天，M1 場景會以一種
      #   看起來像產品缺陷的方式紅。
      - name: 环境快照
        run: |
          echo "── docker ──"; docker version
          echo "── 内核 ──"; uname -a
          echo "── cgroup 层级 ──"; stat -fc %T /sys/fs/cgroup
          echo "── git 行尾配置（CRLF 门的前提）──"
          git config --get core.autocrlf || echo "core.autocrlf 未设（Linux 上的默认，正是要的）"

      # ── 建置快取 ───────────────────────────────────────────────────────────
      #
      # ⚠ ⚠ **快取最壞的失效方式不是「沒命中」，是「命中了一份不該用的」。**
      #   兩道防線：① 鍵裡帶 `Dockerfile.build` 的雜湊（工具鏈身分，連 C 工具鏈一起）；
      #   ② `tests/ci/cache.sh` 在歸檔裡另存一份 meta，**灌回前逐字比對**，對不上就跳過。
      #
      # ★ **懷疑快取的時候**：把下面鍵裡的 `v1` 改成 `v2`，整片快取立即作廢。
      - name: 取构建缓存
        id: buildcache
        uses: actions/cache/restore@v6
        with:
          path: ~/fulcrum-cache
          # ★ 精確鍵 = 工具鏈 + 兩把鎖；`restore-keys` 讓它仍然能從**同一套工具鏈**的
          #   上一份熱起來（cargo 增量補差）。
          key: fulcrum-buildcache-v1-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build') }}-${{ hashFiles('Cargo.lock', 'vendor/pingora/Cargo.lock') }}
          restore-keys: |
            fulcrum-buildcache-v1-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build') }}-

      - name: 把缓存灌回 docker 卷
        run: bash tests/ci/cache.sh restore ~/fulcrum-cache

      # ★ ★ ★ 就這一條，結束代碼就是判據。
      # ⚠ 絕不接管道：`| tee` / `| tail` 取回的是右邊那個命令的結束代碼（本儲存庫栽過）。
      - name: 全量门禁
        run: bash tests/m0/docker-run.sh

      # ★ `always()`：門禁紅了也要存 —— 依賴照樣是編好的。
      # ⚠ ⚠ **精確命中時整步跳過**：壓歸檔要幾分鐘，而下面「存建置快取」在命中時本就不跑
      #   ⇒ 壓出來的東西會被原樣扔掉。★ 一步只在「它的產物會被用到」時才該跑。
      # ★ 代價說在明處：命中時快取**不刷新**，快取裡那份 target 相對 HEAD 會越來越舊。
      #   哪天兩把鎖之一變了，鍵跟著變、自然重做一份新的。
      # ★ ★ **診斷必須落到「紀錄之外」的地方** —— 紀錄 blob 取不回來的情況真的發生過
      #   （`gh run view --log` 一直 404 BlobNotFound），那時「加一行 df 讓下一輪自己說話」
      #   本身就沒生效：話是說了，只是沒人聽得見。
      - name: 导出构建缓存
        id: dumpcache
        if: always() && steps.buildcache.outputs.cache-hit != 'true'
        run: bash tests/ci/dump-cache.sh ~/fulcrum-cache ~/cache-diag.txt

      # ★ 與紀錄分開的那條路：artifact 一定取得回來（`gh run download`）。
      - name: 传诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diag
          path: ~/cache-diag.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 存构建缓存
        if: always() && steps.dumpcache.outputs.archived == 'true' && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/fulcrum-cache
          key: fulcrum-buildcache-v1-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build') }}-${{ hashFiles('Cargo.lock', 'vendor/pingora/Cargo.lock') }}
