# HAProxy · 反代吞吐這一類的被測設定（M3，§8 七類之二）。
# ⚠ 佔位符由 bench/case/reverse-proxy-throughput.sh 替換。
#
# ★ ★ **與靜態吞吐那一類不同，這一類裡它沒有那處折扣。**
#   [`haproxy.cfg`](haproxy.cfg) 頭部寫著：HAProxy 不是檔案伺服器，那一類裡它靠
#   `http-request return … file` 回一個固定 body，少做了目錄、條件請求與 range。
#   **反代是它的本職** ⇒ 本檔案裡不存在那條「它少做了幾件事」的口徑註解。
#
# ★ 上游連接重複使用（對齊口徑第 ⑥ 條）：`mode http` 配 `option http-keep-alive`
#   下 HAProxy 預設就重複使用後端連接，開發機實測每千請求 0.7 條。
#   ⛔ **仍然顯式寫著** —— 理由與 `nginx.conf` 裡那句「四家的權限身分必須一致」
#   同源：一個只寫了一半的對齊，下一個人讀不出它是有意還是漏了。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 紀錄關掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend proxy_fe
    bind :__PORT__
    default_backend proxy_be

backend proxy_be
    server origin1 __ORIGIN_HOST__:__ORIGIN_PORT__
