# HAProxy · 反代吞吐这一类的被测配置（M3，§8 七类之二）。
# ⚠ 占位符由 bench/case/reverse-proxy-throughput.sh 替换。
#
# ★ ★ **与静态吞吐那一类不同，这一类里它没有那处折扣。**
#   [`haproxy.cfg`](haproxy.cfg) 头部写着：HAProxy 不是文件服务器，那一类里它靠
#   `http-request return … file` 回一个固定 body，少做了目录、条件请求与 range。
#   **反代是它的本职** ⇒ 本文件里不存在那条「它少做了几件事」的口径注解。
#
# ★ 上游连接复用（对齐口径第 ⑥ 条）：`mode http` 配 `option http-keep-alive`
#   下 HAProxy 默认就复用后端连接，开发机实测每千请求 0.7 条。
#   ⛔ **仍然显式写着** —— 理由与 `nginx.conf` 里那句「四家的权限身份必须一致」
#   同源：一个只写了一半的对齐，下一个人读不出它是有意还是漏了。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 日志关掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend proxy_fe
    bind :__PORT__
    default_backend proxy_be

backend proxy_be
    server origin1 __ORIGIN_HOST__:__ORIGIN_PORT__
