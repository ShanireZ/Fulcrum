# HAProxy ·「内联回一份正文」形态的被测配置（M3）。
# ★ 按**形态**命名：今天的用户是 bench/case/short-connection-throughput.sh。
# ⚠ 占位符由用例脚本替换。
#
# ★ 与 bench/conf/haproxy.cfg 同一个 `file` 形态：HAProxy **启动时**把文件读进内存，
#   请求到来时把那份内容拷进输出缓冲（v3.2.0 `src/http_ana.c` 的 `http_reply_to_htx`，
#   `htx_add_data_atonce`）⇒ 与另外三家同为「从内存回」，⛔ 不是在读文件。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 日志关掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend respond
    bind :__PORT__
    http-request return status 200 content-type "application/octet-stream" file "__PAYLOAD__"
