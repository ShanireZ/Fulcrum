# HAProxy ·「內聯回一份正文」形態的被測設定（M3）。
# ★ 按**形態**命名：今天的使用者是 bench/case/short-connection-throughput.sh。
# ⚠ 佔位符由案例指令碼替換。
#
# ★ 與 bench/conf/haproxy.cfg 同一個 `file` 形態：HAProxy **啟動時**把檔案讀進記憶體，
#   請求到來時把那份內容拷進輸出緩衝（v3.2.0 `src/http_ana.c` 的 `http_reply_to_htx`，
#   `htx_add_data_atonce`）⇒ 與另外三家同為「從記憶體回」，⛔ 不是在讀檔案。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 紀錄關掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend respond
    bind :__PORT__
    http-request return status 200 content-type "application/octet-stream" file "__PAYLOAD__"
