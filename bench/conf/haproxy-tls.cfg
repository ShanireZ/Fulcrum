# TLS 握手那一類（G168，bench/case/tls-handshake.sh）—— 與 `haproxy-respond.cfg` 同一個形態，加上 TLS。
#
# ⚠ ⚠ `no-tls-tickets` + `tune.ssl.cachesize 0` **不夠**：HAProxy 3.2 跑在 OpenSSL 3.5 上，TLS 1.3 下
#   `SSL_OP_NO_TICKET` 只是改發**有狀態**的 ticket，每條連接仍是 2 張（2026-10-23 實測）。
#   HAProxy 沒有對應 `NumTickets` 的設定鍵 ⇒ 案例指令碼以 `OPENSSL_CONF=<只寫 NumTickets = 0 的檔案>`
#   起**這一個**處理程序（實測 0 張）。是否真的 0 張由開跑前的探針判，⛔ 不靠這段註解。
global
    nbthread __WORKERS__
    maxconn 20000
    log /dev/null local0 emerg
    tune.ssl.cachesize 0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend respond
    bind :__PORT__ ssl crt __PEM__ curves __TLS_GROUP__ no-tls-tickets
    http-request return status 200 content-type "application/octet-stream" file "__PAYLOAD__"
