# HAProxy · 靜態吞吐這一類的被測設定（M3 第一刀）。
# ⚠ 佔位符由 bench/case/static-throughput.sh 替換。
#
# ★ ★ ★ **口徑必須先說清楚：HAProxy 不是檔案伺服器。**
#   它在這一類裡靠 `http-request return ... file <路径>` 回一個**固定的 body** ——
#   那是它能做到的最接近「服務一個靜態資源」的事，⛔ 但它不做目錄、不做
#   條件請求、不做 range。⇒ 這一類量的是「把同一個固定 body 推出去有多快」，
#   而 §8 的「靜態吞吐」正是這個意思。
#   ⚠ ⚠ **這條口徑不許被讀成「HAProxy 在這一類裡吃虧 / 佔便宜」**：它少做了
#   幾件事，⇒ 若它在這一類領先，那個領先裡有一部分來自它沒做的那幾件。
#   README 那一節把這句話寫在明處，⛔ 別在引用數字時把它丟掉。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 紀錄關掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend static
    bind :__PORT__
    http-request return status 200 content-type "application/octet-stream" file "__PAYLOAD__"
