# HAProxy · 静态吞吐这一类的被测配置（M3 第一刀）。
# ⚠ 占位符由 bench/case/static-throughput.sh 替换。
#
# ★ ★ ★ **口径必须先说清楚：HAProxy 不是文件服务器。**
#   它在这一类里靠 `http-request return ... file <路径>` 回一个**固定的 body** ——
#   那是它能做到的最接近「服务一个静态资源」的事，⛔ 但它不做目录、不做
#   条件请求、不做 range。⇒ 这一类量的是「把同一个固定 body 推出去有多快」，
#   而 §8 的「静态吞吐」正是这个意思。
#   ⚠ ⚠ **这条口径不许被读成「HAProxy 在这一类里吃亏 / 占便宜」**：它少做了
#   几件事，⇒ 若它在这一类领先，那个领先里有一部分来自它没做的那几件。
#   README 那一节把这句话写在明处，⛔ 别在引用数字时把它丢掉。

global
    nbthread __WORKERS__
    maxconn 20000
    # ★ 日志关掉 —— 四家一致。
    log /dev/null local0 emerg

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend static
    bind :__PORT__
    http-request return status 200 content-type "application/octet-stream" file "__PAYLOAD__"
