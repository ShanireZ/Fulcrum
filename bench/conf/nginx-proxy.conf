# nginx · 反代吞吐这一类的被测配置（M3，§8 七类之二）。
# ⚠ 占位符由 bench/case/reverse-proxy-throughput.sh 替换。
#
# ★ `daemon off` 与 `user root` 的理由与 [`nginx.conf`](nginx.conf) 里那两段逐字
#   相同（拿得到 pid / 四家的权限身份必须一致），⛔ 不在这里重述。
#
# ★ ★ ★ **`upstream` 那一块与 `location` 里那三行是口径，⛔ 不是调优。**
#   本镜像按 digest 钉死的是 nginx **1.29.1**，而 upstream keepalive 是
#   **1.29.7 起**才默认开启的、`proxy_http_version` 也是那时才默认变 1.1
#   （nginx 官方 `ngx_http_upstream_module` / `ngx_http_proxy_module`）。
#   ⇒ 不写它们，这个 nginx **每请求新建一条上游连接**，而另外三家在复用
#   —— 开发机实测：每千请求 1001.5 条对 2.1 条，rps 差 2.5 倍（15364.5 → 38182.7）。
#
#   ⚠ ⚠ **而 oha 的 JSON 里看不出这件事** —— 输出一切正常，只是这一家的数被
#   系统性压低，且 nginx 在静态吞吐里是**第二强** ⇒ 它被低估会直接污染
#   「该类最强者」与判据 ④C。⇒ 由 `bench_upstream_reuse_violations` 判着
#   （`tests/bench/gate.sh` 的 C20 第 ② 半）。
#
#   ⚠ **升级镜像里的 nginx digest 时必须复核本段**：默认值会随版本变，
#   而显式写着在两个版本上都正确。

daemon off;
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 访问日志关掉 —— 四家一致（对齐口径见 bench/README.md）。
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    # ⚠ 有意**不 include mime.types**：理由与 nginx.conf 那一段相同。
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    upstream bench_origin {
        server __ORIGIN_HOST__:__ORIGIN_PORT__;
        keepalive 64;
    }

    server {
        listen __PORT__ backlog=4096;
        location / {
            proxy_pass http://bench_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
