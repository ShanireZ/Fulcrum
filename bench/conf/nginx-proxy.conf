# nginx · 反代吞吐這一類的被測設定（M3，§8 七類之二）。
# ⚠ 佔位符由 bench/case/reverse-proxy-throughput.sh 替換。
#
# ★ `daemon off` 與 `user root` 的理由與 [`nginx.conf`](nginx.conf) 裡那兩段逐字
#   相同（拿得到 pid / 四家的權限身分必須一致），⛔ 不在這裡重述。
#
# ★ ★ ★ **`upstream` 那一塊與 `location` 裡那三行是口徑，⛔ 不是調優。**
#   本鏡像按 digest 釘死的是 nginx **1.29.1**，而 upstream keepalive 是
#   **1.29.7 起**才預設開啟的、`proxy_http_version` 也是那時才預設變 1.1
#   （nginx 官方 `ngx_http_upstream_module` / `ngx_http_proxy_module`）。
#   ⇒ 不寫它們，這個 nginx **每請求新建一條上游連接**，而另外三家在重複使用
#   —— 開發機實測：每千請求 1001.5 條對 2.1 條，rps 差 2.5 倍（15364.5 → 38182.7）。
#
#   ⚠ ⚠ **而 oha 的 JSON 裡看不出這件事** —— 輸出一切正常，只是這一家的數被
#   系統性壓低，且 nginx 在靜態吞吐裡是**第二強** ⇒ 它被低估會直接汙染
#   「該類最強者」與判據 ④C。⇒ 由 `bench_upstream_reuse_violations` 判著
#   （`tests/bench/gate.sh` 的 C20 第 ② 半）。
#
#   ⚠ **升級鏡像裡的 nginx digest 時必須複核本段**：預設值會隨版本變，
#   而顯式寫著在兩個版本上都正確。

daemon off;
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 訪問紀錄關掉 —— 四家一致（對齊口徑見 bench/README.md）。
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    # ⚠ 有意**不 include mime.types**：理由與 nginx.conf 那一段相同。
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    upstream bench_origin {
        server __ORIGIN_HOST__:__ORIGIN_PORT__;
        # ★ ★ 上限跟著並行數走，⛔ 不寫死（2026-09-10）。`keepalive N` 是「**每個 worker**
        #   最多留幾條空閒上游連接，超出按 LRU 關掉」（nginx 官方文件）⇒ 寫死 64 時
        #   2 個 worker × 64 < 視窗的 200 並行，多出來的連接每一輪都要新建 —— 開發機
        #   200 並行單變數實測 130.16 → 1.35 條/千（rps 31736 → 38302），視窗二里報成 21.26。
        #   ⇒ `__IDLE_CAP__` 由案例指令碼按 `bench_upstream_idle_cap`（`bench/lib.sh`）
        #   = max(64, 並行連接數) 繪製：每個 worker 都留夠並行數；門禁的 10 條連接下仍是 64。
        keepalive __IDLE_CAP__;
    }

    server {
        listen __PORT__ backlog=4096;
        location / {
            proxy_pass http://bench_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
