# nginx ·「內聯回一份正文」形態的被測設定（M3）。
# ★ 按**形態**命名：今天的使用者是 bench/case/short-connection-throughput.sh。
# ⚠ 佔位符由案例指令碼替換。
#
# ⚠ ⚠ ★ **正文為什麼是兩個變數拼的**（owner 2026-09-23 批）：nginx 讀設定用一塊
#   **4096 位元組**的緩衝區（1.29.1 `src/core/ngx_conf_file.c`：`NGX_CONF_BUFFER 4096`），
#   一個參數長到填滿它就當場報 `too long parameter` ⇒ 4096 位元組的正文寫成一個參數解析不了
#   （2026-09-23 實物核過：對拍鏡像裡這個 nginx，4000 位元組 `nginx -t` 通過、4096 位元組回報錯誤）。
#   ⇒ 拆成兩半，在 `return` 裡拼起來。
# ⚠ **代價寫在明處**：靜態文字的 `return` 不拷貝，拼接則每請求多一次約 4 KB 的分配 + 拷貝。
#   另外三家本來就在每請求上處理一遍正文（Caddy 掃佔位符再寫、HAProxy 拷進輸出緩衝、
#   樞衡 `respond` 展開一遍），⇒ 拼接讓 nginx 做的是同一類活，⛔ 但比它自己的最優寫法多一步。
#   ★ **方向**：若 nginx 是這一類的最強者，門檻會被略微壓低 ⇒ 對樞衡有利 ⇒ `PASS` 打折扣，
#   `FAIL` 不受影響。⛔ 不聲稱它有多小（沒量過）。
#
# ★ `daemon off` / `user root` / 紀錄與暫存目錄 —— 與 bench/conf/nginx.conf 同一套理由。

daemon off;
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 訪問紀錄關掉 —— 四家一致。
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    server {
        listen __PORT__ backlog=4096;
        location / {
            set $p1 "__BODY_1__";
            set $p2 "__BODY_2__";
            return 200 "$p1$p2";
        }
    }
}
