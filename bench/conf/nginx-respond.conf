# nginx ·「内联回一份正文」形态的被测配置（M3）。
# ★ 按**形态**命名：今天的用户是 bench/case/short-connection-throughput.sh。
# ⚠ 占位符由用例脚本替换。
#
# ⚠ ⚠ ★ **正文为什么是两个变量拼的**（owner 2026-09-23 批）：nginx 读配置用一块
#   **4096 字节**的缓冲区（1.29.1 `src/core/ngx_conf_file.c`：`NGX_CONF_BUFFER 4096`），
#   一个参数长到填满它就当场报 `too long parameter` ⇒ 4096 字节的正文写成一个参数解析不了
#   （2026-09-23 实物核过：对拍镜像里这个 nginx，4000 字节 `nginx -t` 通过、4096 字节报错）。
#   ⇒ 拆成两半，在 `return` 里拼起来。
# ⚠ **代价写在明处**：静态文本的 `return` 不拷贝，拼接则每请求多一次约 4 KB 的分配 + 拷贝。
#   另外三家本来就在每请求上处理一遍正文（Caddy 扫占位符再写、HAProxy 拷进输出缓冲、
#   枢衡 `respond` 展开一遍），⇒ 拼接让 nginx 做的是同一类活，⛔ 但比它自己的最优写法多一步。
#   ★ **方向**：若 nginx 是这一类的最强者，门槛会被略微压低 ⇒ 对枢衡有利 ⇒ `PASS` 打折扣，
#   `FAIL` 不受影响。⛔ 不声称它有多小（没量过）。
#
# ★ `daemon off` / `user root` / 日志与临时目录 —— 与 bench/conf/nginx.conf 同一套理由。

daemon off;
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 访问日志关掉 —— 四家一致。
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    server {
        listen __PORT__ backlog=4096;
        location / {
            set $p1 "__BODY_1__";
            set $p2 "__BODY_2__";
            return 200 "$p1$p2";
        }
    }
}
