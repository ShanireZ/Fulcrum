# TLS 握手那一類（G168，bench/case/tls-handshake.sh）—— 與 `nginx-respond.conf` 同一個形態，加上 TLS。
#
# ⚠ ⚠ `ssl_session_tickets off` + `ssl_session_cache off` **不夠**：nginx 1.29 跑在 OpenSSL 3.5 上，
#   TLS 1.3 下仍每條連接發 2 張有狀態 ticket（2026-10-23 實測）；再加 `ssl_conf_command NumTickets 0` 才是 0 張。
#   是否真的 0 張由開跑前的探針判，⛔ 不靠這段註解。
# ⚠ 正文照舊兩個變數拼（讀設定的緩衝區只有 4096 位元組），不對等的方向見 `nginx-respond.conf` 頭部與 bench/README.md。
daemon off;
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    access_log off;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    default_type application/octet-stream;
    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    server {
        listen __PORT__ ssl backlog=4096;
        server_name __NAME__;
        ssl_certificate __CERT__;
        ssl_certificate_key __KEY__;
        ssl_ecdh_curve __TLS_GROUP__;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_conf_command NumTickets 0;
        location / {
            set $p1 "__BODY_1__";
            set $p2 "__BODY_2__";
            return 200 "$p1$p2";
        }
    }
}
