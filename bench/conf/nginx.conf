# nginx · 靜態吞吐這一類的被測設定（M3 第一刀）。
# ⚠ 佔位符由 bench/case/static-throughput.sh 替換。
# ★ `daemon off`：編排指令碼要拿得到它的 pid 才收得掉它。

daemon off;
# ⚠ ⚠ **`user root` 是口徑，不是偷懶。** 兩條理由：
#   ① 官方鏡像裡 nginx 的預設 `user nginx` 相依套件安裝時建出來的那個系統使用者，
#      而本鏡像只搬了二進位 ⇒ 不寫這一行會 `getpwnam("nginx") failed` 起不來
#      （實測，2026-09-05）。⛔ 不要改成「在 Dockerfile 裡補一個 nginx 使用者」——
#      那會讓四家裡只有它降權，而降權本身對吞吐是有代價的。
#   ② 另外三家在這個容器裡也都是 root ⇒ **四家的權限身分必須一致**，
#      否則量到的差異裡混進了一條與產品無關的變數。
# ★ nginx 會為此打一條 warning，那是預期內的，⛔ 別把它當成設定錯。
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 訪問紀錄關掉 —— 四家一致（對齊口徑見 bench/README.md）。
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    # ⚠ 有意**不 include mime.types**：這一類量的是吞吐，而 MIME 猜測會讓四家
    #   在「回什麼 Content-Type」上產生差異 —— 那是另一件事。預設類型四家統一成一個。
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    server {
        listen __PORT__ backlog=4096;
        root __WWW_ROOT__;
        location / {
        }
    }
}
