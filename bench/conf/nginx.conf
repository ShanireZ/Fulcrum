# nginx · 静态吞吐这一类的被测配置（M3 第一刀）。
# ⚠ 占位符由 bench/case/static-throughput.sh 替换。
# ★ `daemon off`：编排脚本要拿得到它的 pid 才收得掉它。

daemon off;
# ⚠ ⚠ **`user root` 是口径，不是偷懒。** 两条理由：
#   ① 官方镜像里 nginx 的默认 `user nginx` 依赖包安装时建出来的那个系统用户，
#      而本镜像只搬了二进制 ⇒ 不写这一行会 `getpwnam("nginx") failed` 起不来
#      （实测，2026-09-05）。⛔ 不要改成「在 Dockerfile 里补一个 nginx 用户」——
#      那会让四家里只有它降权，而降权本身对吞吐是有代价的。
#   ② 另外三家在这个容器里也都是 root ⇒ **四家的权限身份必须一致**，
#      否则量到的差异里混进了一条与产品无关的变量。
# ★ nginx 会为此打一条 warning，那是预期内的，⛔ 别把它当成配置错。
user root;
worker_processes __WORKERS__;
pid __RUN_DIR__/nginx.pid;
error_log __RUN_DIR__/nginx.err crit;

events {
    worker_connections 8192;
}

http {
    # ★ 访问日志关掉 —— 四家一致（对齐口径见 bench/README.md）。
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    # ⚠ 有意**不 include mime.types**：这一类量的是吞吐，而 MIME 猜测会让四家
    #   在「回什么 Content-Type」上产生差异 —— 那是另一件事。默认类型四家统一成一个。
    default_type application/octet-stream;

    client_body_temp_path __RUN_DIR__/nginx-body;
    proxy_temp_path __RUN_DIR__/nginx-proxy;
    fastcgi_temp_path __RUN_DIR__/nginx-fastcgi;
    uwsgi_temp_path __RUN_DIR__/nginx-uwsgi;
    scgi_temp_path __RUN_DIR__/nginx-scgi;

    server {
        listen __PORT__ backlog=4096;
        root __WWW_ROOT__;
        location / {
        }
    }
}
