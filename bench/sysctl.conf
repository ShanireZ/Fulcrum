# 对拍**宿主**的内核参数（M3）。★ G145 起，这份文件里只剩**一条**。
#
# ★ ★ ★ **它不是「调优」，是把一批会静默改变读数的东西钉成常数。**
#   对拍要回答的是「四家谁更快」，⇒ 只要四家面对的是**同一套**内核参数，
#   这些值取多少都不影响那个结论；⛔ 但它们**取值不定**就会让两趟之间不可比，
#   而那正是 §9 那条缓解项（「基准环境用脚本固化，含内核参数与 CPU 亲和」）要治的。
#
# ⚠ ⚠ ★ **每一条都写明「不设会怎样」。** 一个只有数字没有理由的内核参数清单，
#   下一个人既不敢改也不敢删 —— 而那种清单会一直被抄下去，即使它早就不适用了。
#
# ── ★★★ G145：为什么这份文件从六条变成了一条 ──────────────────────────────
#
# 2026-09-06 在本机与那台候选对拍宿主上两个方向都实测过：
#
#   宿主 net.ipv4.ip_local_port_range = 20000 60000 ⇒ 新开的默认网络容器仍读到 32768 60999
#   宿主 net.core.somaxconn           = 12345       ⇒ 新开的默认网络容器仍读到 4096
#
# 那四个键是 **per-netns** 的，而对拍**整个跑在自己 netns 的容器里**
# ⇒ 在宿主上固化它们，对被测行为**零影响**。
# ⚠ ⚠ 一份诚实的「已按 sysctl.conf 固化」声明，因此可以完全属实、同时什么也没做 ——
#   ★ 这正是本仓最在意的那一族：**一道恒绿的门与一道不存在的门，输出完全一样。**
#
# ⇒ 它们改由 `docker run --sysctl` 在**容器里**设，声明在 `bench/lib.sh` 的
#   `bench_container_sysctls`，并由 `bench/env-snapshot.sh` 逐条断言「实测==声明」。
#   ⛔ 别把它们加回本文件：加回来 = 在宿主上设一遍没用的，然后以为设过了。
#
# 另外两条的去向：
#   · `fs.file-max` **移除**。⚠ 那台机器上它是 `9223372036854775807`（内核自算的），
#     而原先这里写的 `2097152` 是把它**往下压**。⇒ 真正会咬的是每进程的
#     `RLIMIT_NOFILE`（★ 实测容器缺省只有 **1024**），它由 `--ulimit nofile` 设、
#     由环境快照核。原文件末尾那段「file-max 管不到 RLIMIT_NOFILE」的提醒是对的 ——
#     ⇒ G145 做的就是**照那句提醒去设真正会咬的那个**。
#   · `net.core.netdev_max_backlog` **留下**，见下。
#
# ── 怎么用 ──────────────────────────────────────────────────────────────────
#
#   sudo cp bench/sysctl.conf /etc/sysctl.d/99-fulcrum-bench.conf
#   sudo sysctl --system
#   cat /proc/sys/net/core/netdev_max_backlog        # ★ 核一遍，⛔ 别只看回显
#
# ⛔ **这是一次机器级改动** —— 由人执行并对它负责，⛔ 不由门禁自动应用。
# ★ 但**这一趟对拍跑不跑得起来**不再靠纪律：`bench/docker-run.sh` 在宿主上直读
#   `/proc/sys/net/core/netdev_max_backlog`，不等于下面这个值就**拒绝启动**。

# ── 收包队列：内核来不及处理时，丢的是包不是请求 ───────────────────────────
#
# ★ ★ ★ **六个键里只有它既设得进又真的相关**，理由有三条，缺一不可：
#   ① 它**非 netns 化** ⇒ 宿主上设的值容器里真的算数（与上面那四个正相反）；
#   ② **环回包也走 per-CPU `input_pkt_queue`**，正是这个键管的队列 ——
#      ⛔ 别以为「只走 loopback 就没有收包队列」；
#   ③ 那台候选宿主的出厂值实测是 **1000**，而四家 + oha 全在一个容器里对打，
#      环回包速率是每秒数十万级 —— 1000 是有可能被填满的。
#
# 不设会怎样：队列溢出即丢包 ⇒ 触发重传，四家**一起**变慢。
# ⚠ ⚠ 症状指不出原因在这里：判据 ③ 看到「四家一起变差」，判据 ④（G142 的 B 收敛）
#   看到「四家挤在一起」⇒ 两条都会响，而**两条都说不出是这个队列满了**。
# ★ 它**可以被量**，⛔ 不必猜：`/proc/net/softnet_stat` 第 2 列就是这一项的丢包数，
#   而它是**全局**的（实测容器里读到的就是宿主的）⇒ 对拍前后各读一次即可对账。
# ⚠ 与 socket 缓冲不同，它是**队列深度**而非每连接的窗口 ⇒ 不改变「谁更快」的结论方向。
net.core.netdev_max_backlog = 16384

# ── 有意**不**放进来的 ─────────────────────────────────────────────────────
#
# ⛔ `net.ipv4.tcp_congestion_control`（bbr / cubic）—— 它**会改变结论本身**：
#    拥塞控制算法影响吞吐与延迟分布，而四家跑在同一台机器上、走 loopback，
#    换算法等于换了被测对象的一部分。⇒ 保持发行版默认，并由环境快照记下来。
# ⛔ `net.core.rmem_max` / `wmem_max` —— 同上：调大 socket 缓冲会让「谁更快」
#    这个结论跟着缓冲走。loopback 上它们本就不是瓶颈。
# ⛔ 任何 `vm.*`（swappiness 之类）—— 对拍宿主的判据里已经有「1 分钟负载 < 0.50」
#    与「专机」两条，机器本就不该在换页。
# ⛔ ⛔ `net.ipv4.tcp_tw_recycle` —— 它在 Linux 4.12 里**已被删除**，而且在 NAT
#    后面会**静默丢弃**合法连接。网上大量「压测调优」清单还在抄它。
#    ★ 这条注释留在这里，即使本文件已经不再管临时端口那一族。
