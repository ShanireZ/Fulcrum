# 對拍**宿主**的核心參數（M3）。★ G145 起，這份檔案裡只剩**一條**。
#
# ★ ★ ★ **它不是「調優」，是把一批會靜默改變讀數的東西釘成常數。**
#   對拍要回答的是「四家誰更快」，⇒ 只要四家面對的是**同一套**核心參數，
#   這些值取多少都不影響那個結論；⛔ 但它們**取值不定**就會讓兩趟之間不可比，
#   而那正是 §9 那條緩解項（「基準環境用指令碼固化，含核心參數與 CPU 親和」）要治的。
#
# ⚠ ⚠ ★ **每一條都寫明「不設會怎樣」。** 一個只有數字沒有理由的核心參數清單，
#   下一個人既不敢改也不敢刪 —— 而那種清單會一直被抄下去，即使它早就不適用了。
#
# ── ★★★ G145：為什麼這份檔案從六條變成了一條 ──────────────────────────────
#
# 2026-09-06 在本機與那臺候選對拍宿主上兩個方向都實測過：
#
#   宿主 net.ipv4.ip_local_port_range = 20000 60000 ⇒ 新開的預設網路容器仍讀到 32768 60999
#   宿主 net.core.somaxconn           = 12345       ⇒ 新開的預設網路容器仍讀到 4096
#
# 那四個鍵是 **per-netns** 的，而對拍**整個跑在自己 netns 的容器裡**
# ⇒ 在宿主上固化它們，對被測行為**零影響**。
# ⚠ ⚠ 一份誠實的「已按 sysctl.conf 固化」宣告，因此可以完全屬實、同時什麼也沒做 ——
#   ★ 這正是本儲存庫最在意的那一族：**一道恆綠的門與一道不存在的門，輸出完全一樣。**
#
# ⇒ 它們改由 `docker run --sysctl` 在**容器裡**設，宣告在 `bench/lib.sh` 的
#   `bench_container_sysctls`，並由 `bench/env-snapshot.sh` 逐條斷言「實測==宣告」。
#   ⛔ 別把它們加回本檔案：加回來 = 在宿主上設一遍沒用的，然後以為設過了。
#
# 另外兩條的去向：
#   · `fs.file-max` **移除**。⚠ 那臺機器上它是 `9223372036854775807`（核心自算的），
#     而原先這裡寫的 `2097152` 是把它**往下壓**。⇒ 真正會咬的是每處理程序的
#     `RLIMIT_NOFILE`（★ 實測容器預設只有 **1024**），它由 `--ulimit nofile` 設、
#     由環境快照核。原檔案末尾那段「file-max 管不到 RLIMIT_NOFILE」的提醒是對的 ——
#     ⇒ G145 做的就是**照那句提醒去設真正會咬的那個**。
#   · `net.core.netdev_max_backlog` **留下**，見下。
#
# ── 怎麼用 ──────────────────────────────────────────────────────────────────
#
#   sudo cp bench/sysctl.conf /etc/sysctl.d/99-fulcrum-bench.conf
#   sudo sysctl --system
#   cat /proc/sys/net/core/netdev_max_backlog        # ★ 核一遍，⛔ 別隻看回顯
#
# ⛔ **這是一次機器級改動** —— 由人執行並對它負責，⛔ 不由門禁自動應用。
# ★ 但**這一趟對拍跑不跑得起來**不再靠紀律：`bench/docker-run.sh` 在宿主上直讀
#   `/proc/sys/net/core/netdev_max_backlog`，不等於下面這個值就**拒絕啟動**。

# ── 收包佇列：核心來不及處理時，丟的是包不是請求 ───────────────────────────
#
# ★ ★ ★ **六個鍵裡只有它既設得進又真的相關**，理由有三條，缺一不可：
#   ① 它**非 netns 化** ⇒ 宿主上設的值容器裡真的算數（與上面那四個正相反）；
#   ② **環回包也走 per-CPU `input_pkt_queue`**，正是這個鍵管的佇列 ——
#      ⛔ 別以為「只走 loopback 就沒有收包佇列」；
#   ③ 那臺候選宿主的出廠值實測是 **1000**，而四家 + oha 全在一個容器裡對打，
#      環回包速率是每秒數十萬級 —— 1000 是有可能被填滿的。
#
# 不設會怎樣：佇列溢出即丟包 ⇒ 觸發重傳，四家**一起**變慢。
# ⚠ ⚠ 症狀指不出原因在這裡：判據 ③ 看到「四家一起變差」，判據 ④（G142 的 B 收斂）
#   看到「四家擠在一起」⇒ 兩條都會響，而**兩條都說不出是這個佇列滿了**。
# ★ 它**可以被量**，⛔ 不必猜：`/proc/net/softnet_stat` 第 2 列就是這一項的丟包數，
#   而它是**全域**的（實測容器裡讀到的就是宿主的）⇒ 對拍前後各讀一次即可對帳。
# ⚠ 與 socket 緩衝不同，它是**佇列深度**而非每連接的視窗 ⇒ 不改變「誰更快」的結論方向。
net.core.netdev_max_backlog = 16384

# ── 有意**不**放進來的 ─────────────────────────────────────────────────────
#
# ⛔ `net.ipv4.tcp_congestion_control`（bbr / cubic）—— 它**會改變結論本身**：
#    擁塞控制演算法影響吞吐與延遲分佈，而四家跑在同一臺機器上、走 loopback，
#    換演算法等於換了被測物件的一部分。⇒ 保持發行版預設，並由環境快照記下來。
# ⛔ `net.core.rmem_max` / `wmem_max` —— 同上：調大 socket 緩衝會讓「誰更快」
#    這個結論跟著緩衝走。loopback 上它們本就不是瓶頸。
# ⛔ 任何 `vm.*`（swappiness 之類）—— 對拍宿主的判據裡已經有「1 分鐘負載 < 0.50」
#    與「專機」兩條，機器本就不該在換頁。
# ⛔ ⛔ `net.ipv4.tcp_tw_recycle` —— 它在 Linux 4.12 裡**已被刪除**，而且在 NAT
#    後面會**靜默丟棄**合法連接。網上大量「壓測調優」清單還在抄它。
#    ★ 這條註解留在這裡，即使本檔案已經不再管臨時連接埠那一族。
