# 对拍宿主的内核参数（M3）。
#
# ★ ★ ★ **它不是「调优」，是把一批会静默改变读数的东西钉成常数。**
#   对拍要回答的是「四家谁更快」，⇒ 只要四家面对的是**同一套**内核参数，
#   这些值取多少都不影响那个结论；⛔ 但它们**取值不定**就会让两趟之间不可比，
#   而那正是 §9 那条缓解项（「基准环境用脚本固化，含内核参数与 CPU 亲和」）要治的。
#
# ⚠ ⚠ ★ **每一条都写明「不设会怎样」。** 一个只有数字没有理由的内核参数清单，
#   下一个人既不敢改也不敢删 —— 而那种清单会一直被抄下去，即使它早就不适用了。
#
# ── 怎么用 ──────────────────────────────────────────────────────────────────
#
#   sudo cp bench/sysctl.conf /etc/sysctl.d/99-fulcrum-bench.conf
#   sudo sysctl --system
#   sysctl -a 2>/dev/null | grep -E 'somaxconn|syn_backlog|tw_reuse|local_port_range'
#
# ⛔ **这是一次机器级改动** —— 由人执行并对它负责，⛔ 不由门禁自动应用。
#
# ⚠ ⚠ ⚠ **在容器里读到的 sysctl 不是宿主的。** `bench/env-snapshot.sh` 把容器里
#   读到的那些记成 `sysctl_as_seen_in_container`，而**它们不参与合格性判定**
#   （`bench/README.md`「⛔ 证不了什么」逐字写着这一条）。
#   ⇒ ⛔ **别拿容器里的读数当「已经固化」的证据** —— 那是一个读起来完全正常的错答案。
#   要核就在**宿主上**跑上面那条 `sysctl -a`。
#
# ⚠ 这份清单**有意很短**。每加一条都要能回答「不设它，四家的读数会怎样一起失真」；
#   答不上来的就别加 —— 一个越长的固化清单，越像在为某一家调优。

# ── 连接建立：队列不够长时，量到的是队列不是服务器 ──────────────────────────
#
# 不设会怎样：高并发短连接那一类（§8 七类之一）打上来时，内核在**握手阶段**就丢包，
# 四家会一起出现重传与超时 ⇒ 读数一起变低，而**看起来像四家都慢**，
# 不像「宿主的队列满了」。★ 这是本清单里最要紧的一条。
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# ── 收包队列：内核来不及处理时，丢的是包不是请求 ───────────────────────────
#
# 不设会怎样：环回上包速率极高（四家都在同一台机器上收发），默认 netdev 积压队列
# （常见 1000）在高包率下会**溢出并丢包** ⇒ 触发重传，四家一起变慢。
# ★ 它与上面 `somaxconn` 那条是同一族：**队列不够长时，量到的是队列不是服务器**，
#   而症状（四家一起慢）指不出原因在这里。
# ⚠ 与 socket 缓冲不同，它是**队列深度**而非每连接的窗口 ⇒ 不改变「谁更快」的结论方向。
net.core.netdev_max_backlog = 16384

# ── 临时端口：压测端自己会先耗尽端口 ───────────────────────────────────────
#
# 不设会怎样：负载生成器与被测在同一台机器上、走 loopback，短连接那一类会以每秒
# 数万的速度消耗临时端口。默认区间（常见 32768–60999，约 2.8 万个）配上 TIME_WAIT
# 的 60 秒停留，**几秒之内就会耗尽** ⇒ oha 侧开始报 connect 失败。
# ⚠ 那时判据 ③ 看到的是「四家一起变差」，而判据 ④（G142）看到的是「四家挤在一起」
#   —— 两条都会响，但**都指不出真正的原因在这里**。
net.ipv4.ip_local_port_range = 10240 65535

# 不设会怎样：同上那一族。`tw_reuse` 让**主动发起方**（就是压测端）复用处于
# TIME_WAIT 的连接，直接缓解上面那条。
# ⛔ ⛔ **有意不写 `net.ipv4.tcp_tw_recycle`** —— 它在 Linux 4.12 里**已被删除**，
#   而且在 NAT 后面会**静默丢弃**合法连接。网上大量「压测调优」清单还在抄它，
#   ⇒ 这条注释本身就是这份文件存在的理由之一。
net.ipv4.tcp_tw_reuse = 1

# ── 文件描述符：连接数的硬上限 ──────────────────────────────────────────────
#
# 不设会怎样：`-c 50` 这种量级碰不到，但高并发那一类（数千并发）会撞上
# 每进程 1024 的默认软限制 ⇒ 被测**报错退出或拒绝新连接**，而那与「它慢」
# 在 oha 的输出里长得不一样（会进 errorDistribution）—— ★ 好在 `read-raw.py`
# 那道门会因此判该份读数无效，⇒ 这条是**防止白跑一趟**，不是防止误判。
fs.file-max = 2097152

# ⚠ ⚠ **`fs.file-max` 是系统级的，它管不到每进程的 `RLIMIT_NOFILE`。**
#   那一格要在 systemd unit 里写 `LimitNOFILE=`，或跑之前 `ulimit -n`。
#   ⇒ 只设这一行**不足以**解决 fd 上限，这句话必须留在这里，
#     否则下一个人会以为已经设好了 —— 而症状要到几千并发那天才出现。

# ── 有意**不**放进来的 ─────────────────────────────────────────────────────
#
# ⛔ `net.ipv4.tcp_congestion_control`（bbr / cubic）—— 它**会改变结论本身**：
#    拥塞控制算法影响吞吐与延迟分布，而四家跑在同一台机器上、走 loopback，
#    换算法等于换了被测对象的一部分。⇒ 保持发行版默认，并由环境快照记下来。
# ⛔ `net.core.rmem_max` / `wmem_max` —— 同上：调大 socket 缓冲会让「谁更快」
#    这个结论跟着缓冲走。loopback 上它们本就不是瓶颈。
# ⛔ 任何 `vm.*`（swappiness 之类）—— 对拍宿主的判据里已经有「1 分钟负载 < 0.50」
#    与「专机」两条，机器本就不该在换页。
