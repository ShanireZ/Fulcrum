---
version: 1
# 「未被認領的繼承 fd」場景專用（tests/m0/unclaimed.sh）。與 m0.yaml 的唯一差別是
# run 目錄與升級 socket 各用各的，免得兩個場景搶同一個 pid/sock 檔案。
daemon: true
error_log: /w/run/m0-unclaimed/error.log
pid_file: /w/run/m0-unclaimed/m0.pid
upgrade_sock: /w/run/m0-unclaimed/m0-upgrade.sock

# 執行緒模型已由 G35 結案（work_stealing 保持 true；執行緒數按 service 角色定預設）。
# 這裡仍用一個明確的小值，是為了讓紀錄與行為可讀——spike 不是產品預設值。
threads: 2
listener_tasks_per_fd: 1
work_stealing: true

# ★ 與 m0.yaml 相反：這個場景**不測長連接**，只想讓老一代儘快退出。
#   因為「未被認領的 fd 黑洞化」只有在老一代消失之後才顯形——
#   在那之前老一代仍持有同一個監聽 socket 並照常 accept。
#   ⚠ 注意 pingora 在發完 fd 後還會硬等 CLOSE_TIMEOUT（5 秒，server/mod.rs:59）
#   才廣播停機，那段時間沒法縮短，所以老一代最快也要 ~7 秒才走乾淨。
grace_period_seconds: 2
graceful_shutdown_timeout_seconds: 2
