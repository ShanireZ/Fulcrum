---
version: 1
daemon: true
error_log: /w/run/m0/error.log
pid_file: /w/run/m0/m0.pid
upgrade_sock: /w/run/m0/m0-upgrade.sock

# 執行緒模型已由 G35 結案（work_stealing 保持 true；執行緒數按 service 角色定預設）。
# 這裡仍用一個明確的小值，是為了讓紀錄與行為可讀——spike 不是產品預設值。
threads: 2
listener_tasks_per_fd: 1
work_stealing: true

# 排空視窗必須大於測試時長，否則「長連接被切斷」會是排空到點造成的，
# 而不是接縫失敗造成的——那樣斷言就失去意義了。
grace_period_seconds: 30
graceful_shutdown_timeout_seconds: 30
