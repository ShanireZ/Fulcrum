---
version: 1

# ★ ★ 前台執行。這不是風格選擇，是 G31 的產品決策，也是本 spike 的全部前提：
#   daemonize() 會 fork，pingora 自己的註解寫著「run() 之前建立的任何執行緒都會丟失」，
#   而升級觸發器就住在那樣一個執行緒裡。`m1-systemd` 啟動時會**拒絕** daemon=true。
daemon: false

# ★ ★ 實測（讀 vendor/pingora/pingora-core/src/server/daemon.rs）：`error_log` 與 `pid_file`
#   **只在 daemonize() 裡被讀**，`daemon: false` 時那段程式碼整個不執行。也就是說前台模式下
#   這兩個設定項會被**安靜地忽略**——設定裡寫了路徑，檔案永遠不出現。
#   這是個很難查的假象，產品要麼自己兌現，要麼顯式拒絕。本 spike 的處理是分開的：
#
#   · `error_log` —— **不寫**。紀錄走 stderr → journal，正是 G31/G33 定的那條路。
#   · `pid_file`  —— **寫，並且由 m1-systemd 自己兌現**（pingora 不管）。
#
# ★ pid 檔案在 G33 裡被判為「不需要」，那句話說的是 systemd 的 `PIDFile=` 指令
#   （`Type=notify` 下 systemd 自己跟蹤 MainPID），**不是**「沒有任何東西需要知道當前是哪一代」。
#   本 spike 實測出的形狀恰恰需要它：`ExitType=cgroup` 之下 unit 的 MainPID 在第一次升級後
#   變成 0，`ExecReload=/bin/kill -USR2 $MAINPID` 當場失效 —— reload 必須從這個檔案裡
#   找當前這一代。寫它的是每一代自己，且是在**服務真的起來之後**才寫（write + rename 原子替換）。
pid_file: /run/fulcrum-m1/fulcrum.pid

# 升級 socket 放在 RuntimeDirectory 裡（G33：/run/<name>，由 systemd 建目錄並設權限）。
upgrade_sock: /run/fulcrum-m1/upgrade.sock

threads: 2
listener_tasks_per_fd: 1
work_stealing: true

# ★ 比 M0 的 30/30 小得多，因為 M1 這一輪要量的是 **systemd 的反應**，
#   而每一次 `systemctl stop` 都要真等滿 grace + graceful（見下），
#   30/30 會讓每個場景多等一分鐘。
#
# ★ ★ 這兩個數直接決定 unit 檔案裡的 `TimeoutStopSec=`：
#     停機耗時 ≈ grace_period_seconds + graceful_shutdown_timeout_seconds
#     升級時老處理程序還要多等 CLOSE_TIMEOUT（5 秒，pingora 寫死在 server/mod.rs）
#   —— 也就是說 `TimeoutStopSec` 必須 > 10 秒，否則 systemd 會在服務還在排空時就 SIGKILL。
#   這是 2026-08-14 在 M0 的收尾裡量出來的那條（35–65 秒）在小設定下的同一個公式。
grace_period_seconds: 5
graceful_shutdown_timeout_seconds: 5
