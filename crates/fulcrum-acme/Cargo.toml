[package]
name = "fulcrum-acme"
version = "0.1.0"
edition = "2024"
publish = false
description = "枢衡的 ACME 层：账户、订单、挑战求解、签发与续期调度（G53/G54/G56）"

[dependencies]
# ⚠ default-features 關掉的理由見根清單裡那段註解：它的 default 裡就含 aws-lc-rs。
#   守它的是 crates/fulcrum/tests/supply_gates.rs，不是註解。
instant-acme = { workspace = true }
# 證書儲存（G55）、續期判定（G56）、按 SNI 挑證書都在 TLS 層，本 crate 只往裡寫。
fulcrum-tls = { path = "../fulcrum-tls" }
# TLS-ALPN-01 的挑戰證書是現造的（RFC 8737）。★ 新增 0 個包：instant-acme 已經拉了它。
rcgen = { workspace = true }
# 出站 HTTPS：ACME 協定本身 + 原生 Cloudflare / DNSPod（G57）的 API 呼叫。
# ★ 新增 0 個包，理由見根清單。
hyper = { workspace = true }
hyper-util = { workspace = true }
# 出站連接器要實作的形狀（`Service<Uri>`）。★ 新增 0 個包：hyper-util 本來就拉著它。
tower-service = { workspace = true }
# ★ ★ ★ **（G104 第 ③ 處）：`hyper-rustls` 換成了 `pingora-boringssl`。**
#   出站 TLS 從 rustls 換到 BoringSSL，握手與檢核全部交給 `boring::ssl::SslConnector`，
#   本 crate 只寫連接器膠水（`src/https.rs`）。
# ⚠ **BoringSSL 的類型只經 `pingora-boringssl` 拿**，與 `fulcrum-tls` 同一條紀律：
#   多一處版本宣告就多一個把 `boring` 劈成兩份的機會，而劈開之後
#   `SslContextBuilder` 同名卻是兩個類型。★ **新增 0 個包**（`fulcrum-tls` 已經拉著它）。
pingora-boringssl = { workspace = true }
# ARI 的證書標識：`instant-acme` 只認 `&CertificateDer`，而我們的證書類型
# 此後是 BoringSSL 的 `X509`（G104）。
# ★ **純類型定義 crate**（沒有 crypto、沒有 provider、沒有 feature），
#   與 G41/G45 點名的 `rustls` / `tokio-rustls` 不是一類東西；**新增 0 個包**。
rustls-pki-types = { workspace = true }
http-body-util = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ★ 本 crate **不掛在 pingora 的處理程序模型上**，與 `fulcrum-runtime` 同一條紀律：
#   它是「什麼時候該簽、怎麼簽」的邏輯，不是「掛在哪個處理程序模型上」。
#   停機信號用 `tokio::sync::watch::Receiver<bool>` 接——那恰好就是
#   `pingora_core::server::ShutdownWatch` 的真身，所以 `fulcrum-server` 直接傳進來即可。
#
# ⚠ ⚠ ★ **這句話就地改過，原話是「本 crate 不相依 pingora」，而它現在不成立了。**
#   上面那行 `pingora-boringssl` 是一條真的 pingora 相依。
#   ★ 改措辭而不是刪掉這條紀律，是因為**這條紀律要擋的東西一個字沒變**：
#     `pingora-core`（處理程序模型、監聽器、優雅升級）仍然一行都沒進來，
#     而 `pingora-boringssl` 是一層**純類型再匯出**（`pub use boring::ssl;` 那種）。
#   ⚠ 與其讓一句聽起來更乾淨、而與 `Cargo.toml` 相反的話留在這裡 —— 本儲存庫已經
#     為「一條很有道理、卻與程式碼相反的理由」付過一次代價（§5 選 Pingora 那條）。

[dev-dependencies]
# 只給測試用：從產物 DER 裡核對那條 acmeIdentifier 擴充真的在、且真的 critical。
x509-parser = { workspace = true }
