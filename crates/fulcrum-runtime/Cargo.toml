[package]
name = "fulcrum-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "枢衡的运行时对象图：结构化配置 → 站点索引 / 匹配器 / 执行链，纯逻辑不碰网络"

[dependencies]
fulcrum-config = { path = "../fulcrum-config" }
regex = { workspace = true }

[dev-dependencies]
# ★ 只給測試用：`udp_上的_proxy_protocol_两层都拦` 要**繞過 DSL**、
#   直接喂一份結構化設定進來 —— 那正是 G11 說的「公開入口」，
#   而「第二層判據真的存在」這件事只能這麼證。
serde_json = { workspace = true }
