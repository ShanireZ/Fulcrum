[package]
name = "fulcrum-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "枢衡的数据面：把运行时对象图挂到 Pingora 上（HTTP/1.1 + h2c + TLS + ACME + 管理面 + 进程托管）"

[dependencies]
fulcrum-acme = { path = "../fulcrum-acme" }
fulcrum-config = { path = "../fulcrum-config" }
fulcrum-runtime = { path = "../fulcrum-runtime" }
fulcrum-tls = { path = "../fulcrum-tls" }
# ★ ★ **`features = ["boringssl"]` 是硬要求，不是可選項**（G104）：
#   不開任何 TLS feature 的話，產品連結的是另一套程式碼，而它那一批傳遞依賴會留在
#   常規稽核視野之外（G41 查出的 rustls 那條就是這個形狀）。
#   由 crates/fulcrum/tests/supply_gates.rs 門 3 守著 —— 不開就紅。
pingora-core = { workspace = true, features = ["boringssl"] }
# `RequestHeader` / `ResponseHeader`。★ 它必須解析到 vendor 那一份，
# 否則與 pingora-core 裡的同名類型**不是同一個類型**；根 Cargo.toml 的 [patch] 負責這件事。
pingora-http = { workspace = true }
# ★ **本 crate 與 rustls 再無任何關係**（G104）：L4 的 SNI/ALPN 分流已換到
#   BoringSSL 的早回呼（`src/l4.rs` 的 `peek_client_hello`），FORK.md 改動 8 / 8b / 10
#   隨之歸零。⇒ **「依賴圖裡只有一套 TLS」成立**
#   （`cargo tree … -i rustls` → nothing to print）。
#   ⚠ ⚠ **但別說成「產物裡」**：那是第三個問題，由 **G138** 單獨回答（結案 **D23**）——
#   `tests/ci/tls-linkage.sh` 取數 + `tests/musl/product.sh` 判**符號表**；
#   而「鎖裡」是第一個問題 —— `rustls` 那一族**仍然寫在 `Cargo.lock` 裡**，
#   因為鎖是依賴圖的超集。三個問題分別由門 4 / 門 5 / G138 那一格回答。
# BoringSSL 那側的類型（`SslAcceptor` / `SslMethod` / ALPN 那幾樣 / ClientHello 早回呼）。
# ★ 紀律是「優先經這一個 crate 拿」，目的是**類型同一性**。
#   ⚠ G111 破了例（下面那行 `boring`）：只有 `pingora-boringssl` 沒有 re-export 的那幾樣
#   （`symm`）才直接夠 `boring`。**目的沒有變，變的是執行者** ——
#   現在由編譯器在三個 `boring` 消費者之間強制，不再靠約定。
pingora-boringssl = { workspace = true }
# HTTP/3：傳輸層 + `quiche::h3` 語義層（G103 / G105，M2 批 J）。
# ★ ★ **它與上面那一行必須解到同一個 `boring`** —— `SniResolver::install_into()` 收的
#   `SslContextBuilder` 要原樣交給 `quiche::Config::with_boring_ssl_ctx_builder()`，
#   那正是 G104「兩個入口共用同一個 `select_certificate_callback`」的機械落點。
#   ⚠ 解成兩份的話這裡當場編不過 —— **守它的是類型系統，不是那兩道讀包名的門**
#   （門 4 / 門 5 都按名字去重，看不見「一個名字兩個版本」；見 supply_gates.rs）。
# ⚠ feature 的口徑繼承根清單（`default-features = false` + 顯式挑
#   `boringssl-boring-crate`），門 2 守著這一條。
quiche = { workspace = true }
# ★ QUIC 的監聽側還要直接夠到 `quiche::Config::with_boring_ssl_ctx_builder()` 收的那個
#   `boring::ssl::SslContextBuilder` —— 見下面 `boring` 那一行（G111）。
# ⚠ ★ **G111 破例的那條直接依賴**：Retry token 要 `boring::symm` 的 AES-256-GCM，
#   而 `pingora-boringssl` 沒有 re-export `symm`。理由、代價與「owner 給的理由是錯的、
#   結論仍然成立」那一條，全寫在根清單裡那一段 —— 別隻讀這三行。
boring = { workspace = true }
# 連接 ID 與 Retry token 的隨機源（批 J）。★ 新增 0 個包，見根清單那一段。
rand = { workspace = true }
# 只為寫得出 `SessionCustom` 那兩個方法的簽名。★ 新增 0 個包，見根清單那一段。
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
# `http::Uri`：`rewrite` 改過路徑後要重新建構上游請求的 URI。
http = { workspace = true }
# ★ 處理程序託管（G78）：`sd_notify(READY=1)` 與「給自己發 SIGQUIT」。
# ★ 兩條都由 G31 指定過（純 Rust、可 musl 靜態連結，滿足 G13），而且**新增 0 個包**：
#   `libc` 早就在依賴圖裡（pingora 自己就依賴它），`sd-notify` 此前只被 spike 用著。
sd-notify = { workspace = true }
libc = { workspace = true }
# 管理面（G8 的全量 load）收的是**結構化設定 JSON**（G48：與磁碟上那份同一種）。
# ★ 兩條本來就在依賴圖裡，這裡只是變成顯式的直接依賴。
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# 只給判據用：QUIC 握手要一張證書，而這裡的用戶端那一半也是真的 quiche。
# ★ 新增 0 個包：rcgen 早就在依賴圖裡（instant-acme 拉的，見根清單）。
rcgen = { workspace = true }
# 只給判據用：`keepalive` 的單測要暫停的 tokio 時間（`start_paused`），60 秒的空閒視窗才能毫秒級跑完。
# ★ 新增 0 個包：`test-util` 只開 tokio 自己的 `rt` / `sync` / `time`；發佈建置不帶 dev 依賴 ⇒ 產物不受影響。
tokio = { workspace = true, features = ["test-util"] }
