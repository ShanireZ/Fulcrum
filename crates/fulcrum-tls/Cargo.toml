[package]
name = "fulcrum-tls"
version = "0.1.0"
edition = "2024"
publish = false
description = "枢衡的 TLS 层：证书存储（G55）、按 SNI 的动态证书解析（§5.1 第 1 条）、续期判定（G56）"

[dependencies]
# ★ 只為一件事：主機名通配的語義（D18 / G66）必須與站台索引**共用同一份實作**。
#   它是純邏輯（只帶 serde），不引入任何供應鏈面。
fulcrum-config = { path = "../fulcrum-config" }
# ★ ★ ★ **（G104）：從 `pingora-rustls` 換成 `pingora-boringssl`。**
#   BoringSSL 的類型**只經這一個 crate 拿**，不直接依賴 `boring`。
#   理由與「只經 `pingora-rustls` 拿 rustls」完全一樣，而且更硬：
#   ⚠ ⚠ `boring` 的版本必須與 `quiche` 解到**同一個**（G103/G104），
#   而**多一處版本宣告就多一個把它們劈成兩份的機會** ——
#   劈開之後 `SslContextBuilder` 同名卻是兩個類型，編譯期一堆看不懂的類型不匹配。
pingora-boringssl = { workspace = true }
# 從 DER 裡讀證書的有效期與 SAN。
# ★ ★ **G104 之後它留著不是沒改乾淨**：換掉它等於同時換掉「我們對證書的理解」
#   （SAN 取法、時間邊界、非 DNS 類型 SAN 怎麼處理），而這一批換的是 TLS 後端。
#   兩件事分開做，紅了才分得清是哪一件。
x509-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `flock(2)`：跨處理程序串行化同一網域的簽發（G55 第 2 條）。
libc = { workspace = true }

[dev-dependencies]
# 只給判據用：`default_sni` 那幾條要真的往表裡裝證書，而**造一張真證書**是唯一的裝法
# （`CertKey` 收的是 `X509` + `PKey`）。
# ⚠ 判據裡的證書**一律現籤**，不提交進儲存庫：提交的那張遲早過期，而過期那天紅的是
#   「TLS 壞了」，要繞一圈才發現是證書到期（`tests/serve/run.sh` 那段同理）。
# ★ 新增 0 個包：rcgen 早就在依賴圖裡（instant-acme 拉的，見根清單）。
rcgen = { workspace = true }
