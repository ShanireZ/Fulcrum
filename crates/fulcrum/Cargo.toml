[package]
name = "fulcrum"
version = "0.1.0"
edition = "2024"
publish = false
description = "枢衡 Fulcrum 的产品二进制：validate / compile / plan / serve"

[dependencies]
# `issuer_slug`：`validate` 要按**這份設定**的 `acme_ca` 去找證書目錄，不按寫死的預設值。
fulcrum-acme = { path = "../fulcrum-acme" }
fulcrum-config = { path = "../fulcrum-config" }
fulcrum-runtime = { path = "../fulcrum-runtime" }
fulcrum-server = { path = "../fulcrum-server" }
# `serve` 的紀錄。★ 格式裡帶 pid：零停機換代時兩代同時在跑，分不清是誰打的紀錄就沒法讀。
env_logger = { workspace = true }

[[bin]]
name = "fulcrum"
path = "src/main.rs"
