[package]
name = "m1-systemd"
version = "0.0.0"
edition = "2024"
publish = false
description = "M1 第一个 spike：systemd Type=notify 前台运行下的 MainPID 交接与零停机升级（G31 强制）"

[dependencies]
# ★ 重複使用 M0 的三類流量服務，不複製。理由見 spikes/m0-seam/src/lib.rs 頂部。
m0-seam = { path = "../m0-seam" }
pingora-core = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# G31 指定：sd-notify 是純 Rust、可 musl 靜態連結，滿足 G13。
sd-notify = { workspace = true }
# 只用一個函式：給自己發 SIGQUIT（std 沒有 kill）。sd-notify 本就相依它。
libc = { workspace = true }

[[bin]]
name = "m1-systemd"
path = "src/main.rs"
