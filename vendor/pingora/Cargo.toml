[workspace]
resolver = "2"
members = [
    "pingora-core",
    "pingora-error",
    "pingora-http",
    "pingora-pool",
    "pingora-runtime",
    "pingora-timeout",
    "pingora-rustls",
    # ★ 2026-08-25（G104）：加回來的第八個 crate。fork 當初把它刪掉的理由是
    #   「PLAN.md §5.1 第 1 條鎖死 rustls」，而那條約束已被 G104 推翻。
    "pingora-boringssl",
]

[workspace.dependencies]
bstr = "1.12.0"
tokio = "1"
tokio-stream = { version = "0.1" }
async-trait = "0.1.42"
httparse = "1"
bytes = "1.0"
# ★ 替代已失維的 derivative（RUSTSEC-2024-0388）。見 FORK.md。
educe = "0.7.6"
http = "1"
log = "0.4"
futures = "0.3"
h2 = ">=0.4.16"
once_cell = "1"
lru = "0.18.2"
ahash = ">=0.8.9"

[workspace.lints.rust]
# ★ 樞衡 fork（2026-09-24）：第二行是 fork 從 pingora-core 的 [features] 裡刪掉、而原始碼裡仍有
#   #[cfg(feature = "…")] 分支的特性名（openssl / s2n：沒被 vendor 的 TLS 後端；dial9 兩條：見
#   pingora-core/Cargo.toml 那段）。不登記的話每次編譯刷出 58 條 unexpected_cfgs，真的警告會被淹掉。
#   ⚠ 這裡只是「已知的值」，不是「宣告了特性」：`--features s2n` 仍當場報「沒有這個特性」，這正是想要的。
#   ⚠ dial9-cpu-profiling 原始碼裡沒有 cfg 引用，故意不列。
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(tokio_unstable)',
  'cfg(feature, values("openssl", "s2n", "dial9", "dial9-worker-s3"))',
] }

[profile.bench]
debug = true
