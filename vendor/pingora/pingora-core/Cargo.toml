[package]
name = "pingora-core"
version = "0.9.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "network", "pingora"]
exclude = ["tests/*"]
description = """
Pingora's APIs and traits for the core network protocols.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pingora_core"
path = "src/lib.rs"

# ★ 枢衡 fork（2026-09-24）：上游这个 crate 没接 workspace 的 lints；接上是为了拿到那边登记的
#   「已删特性名」（见 ../Cargo.toml 的 [workspace.lints.rust]）。
[lints]
workspace = true

[dependencies]
pingora-runtime = { version = "0.9.0", path = "../pingora-runtime" }
# ★ 枢衡 fork（FORK.md「范围」与「rebase 的步骤」第 4 步）：上游这里还有 pingora-openssl / pingora-s2n
#   两个可选后端，它们没被 vendor（枢衡用不上）⇒ 声明连同 [features] 里的 openssl / s2n 两条一起删；
#   源码里的 #[cfg(feature = "...")] 分支原样保留，永远不会被点亮。
#   ★ pingora-boringssl 是被 vendor 的那一个（G104），它的声明必须写全：路径依赖即使 optional，
#     作为 workspace 成员加载时 cargo 也会读它的清单 —— 这个坑在产品构建时完全不显形。
pingora-boringssl = { version = "0.9.0", path = "../pingora-boringssl", optional = true }
pingora-pool = { version = "0.9.0", path = "../pingora-pool" }
pingora-error = { version = "0.9.0", path = "../pingora-error" }
pingora-timeout = { version = "0.9.0", path = "../pingora-timeout" }
pingora-http = { version = "0.9.0", path = "../pingora-http" }
pingora-rustls = { version = "0.9.0", path = "../pingora-rustls", optional = true }
bstr = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
httparse = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
# ★ 枢衡 fork §3：derivative（RUSTSEC-2024-0388，失维）换成 educe，见 FORK.md。
educe.workspace = true
clap = { version = "4.5", features = ["derive"] }
once_cell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
strum = "0.26.2"
strum_macros = "0.26.2"
libc = "0.2.70"
chrono = { version = "~0.4.31", features = ["alloc"], default-features = false }
sentry = { version = "0.36", features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], default-features = false, optional = true }
regex = "1"
percent-encoding = "2.1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
socket2 = { version = ">=0.4, <1.0.0", features = ["all"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
# ★ 枢衡 fork §1：sfv / rand / brotli 的上界抬到 0.15 / 0.10 / 8（上游仍是 0.10.4 / 0.8 / 3），
#   调用点适配见 FORK.md §2。
sfv = "0.15"
rand = "0.10"
ahash = { workspace = true }
unicase = "2"
brotli = "8"
openssl-probe = "0.1.6"
tokio-test = "0.4"
zstd = "0"
httpdate = "1"
# ★ 枢衡 fork §1（G30，2026-08-20）：上游是 `"0.16.0"`，脱字号自带 `<0.17`，而 instant-acme 要 `^0.18`
#   ⇒ 不抬，产物里就是两份 x509-parser，`tests/vendor/run.sh` 的 [2/5] 会判红并拒绝跑测试。
x509-parser = { version = "0.18.1", optional = true }
ouroboros = { version = "0.18.4", optional = true }
lru = { workspace = true, optional = true }
daggy = "0.8"

[target.'cfg(unix)'.dependencies]
flurry = "0.5"
daemonix = "0.1.0"
nix = { version = "~0.31.1", features = ["socket", "net", "fs", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
h2 = { workspace = true, features = ["unstable"] }
tokio-stream = { version = "0.1", features = ["full"] }
env_logger = "0.11"
reqwest = { version = "0.12", features = [
    "rustls-tls",
    "http2",
], default-features = false }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
http-body-util = "0.1"
rstest = "0.23.0"
# Only used for types in tests; the crypto provider arrives through
# pingora-rustls, so no provider feature is selected here.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }

[[bench]]
name = "h1_pipelining"
harness = false

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = "0.9"
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { package = "tikv-jemallocator", version = "0.6" }

[features]
default = []
# ★ 枢衡 fork：上游的 openssl / s2n 两条随 [dependencies] 里的声明一起删（理由在那里）。
# ★ 枢衡 fork（2026-09-24，0.9.0 起）：上游新增的 dial9 / dial9-worker-s3 / dial9-cpu-profiling 三条也删 ——
#   它们打开 pingora-runtime 的可选依赖 dial9-tokio-telemetry 与 aws-sdk-s3（那份清单里一并删了）。
#   vendor 锁会记下成员 crate 的**全部**可选依赖，而 aws-sdk-s3 的默认特性经 rustls-aws-lc 拉进 aws-lc-rs
#   ⇒ crates/fulcrum/tests/supply_gates.rs 门 1（两把锁里都不许出现 aws-lc-rs）当场红。见 FORK.md。
boringssl = ["pingora-boringssl", "openssl_derived"]
rustls = ["pingora-rustls", "any_tls", "dep:x509-parser", "ouroboros"]
patched_http1 = ["pingora-http/patched_http1"]
openssl_derived = ["any_tls"]
any_tls = []
sentry = ["dep:sentry"]
connection_filter = []
