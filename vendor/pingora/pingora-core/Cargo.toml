[package]
name = "pingora-core"
version = "0.9.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "network", "pingora"]
exclude = ["tests/*"]
description = """
Pingora's APIs and traits for the core network protocols.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pingora_core"
path = "src/lib.rs"

# ★ 樞衡 fork（2026-09-24）：上游這個 crate 沒接 workspace 的 lints；接上是為了拿到那邊登記的
#   「已刪特性名」（見 ../Cargo.toml 的 [workspace.lints.rust]）。
[lints]
workspace = true

[dependencies]
pingora-runtime = { version = "0.9.0", path = "../pingora-runtime" }
# ★ 樞衡 fork（FORK.md「範圍」與「rebase 的步驟」第 4 步）：上游這裡還有 pingora-openssl / pingora-s2n
#   兩個可選後端，它們沒被 vendor（樞衡用不上）⇒ 宣告連同 [features] 裡的 openssl / s2n 兩條一起刪；
#   原始碼裡的 #[cfg(feature = "...")] 分支原樣保留，永遠不會被點亮。
#   ★ pingora-boringssl 是被 vendor 的那一個（G104），它的宣告必須寫全：路徑依賴即使 optional，
#     作為 workspace 成員載入時 cargo 也會讀它的清單 —— 這個坑在產品建置時完全不顯形。
pingora-boringssl = { version = "0.9.0", path = "../pingora-boringssl", optional = true }
pingora-pool = { version = "0.9.0", path = "../pingora-pool" }
pingora-error = { version = "0.9.0", path = "../pingora-error" }
pingora-timeout = { version = "0.9.0", path = "../pingora-timeout" }
pingora-http = { version = "0.9.0", path = "../pingora-http" }
pingora-rustls = { version = "0.9.0", path = "../pingora-rustls", optional = true }
bstr = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
httparse = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
# ★ 樞衡 fork §3：derivative（RUSTSEC-2024-0388，失維）換成 educe，見 FORK.md。
educe.workspace = true
clap = { version = "4.5", features = ["derive"] }
once_cell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
# ★ 樞衡 fork 改動 21：serde_yaml（已棄用，其 unsafe-libyaml 失維，RUSTSEC-2024-0449）換成 serde-saphyr，見 FORK.md。
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }
strum = "0.26.2"
strum_macros = "0.26.2"
libc = "0.2.70"
chrono = { version = "~0.4.31", features = ["alloc"], default-features = false }
sentry = { version = "0.36", features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], default-features = false, optional = true }
regex = "1"
percent-encoding = "2.1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
socket2 = { version = ">=0.4, <1.0.0", features = ["all"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
# ★ 樞衡 fork §1：sfv / rand / brotli 的上界抬到 0.15 / 0.10 / 8（上游仍是 0.10.4 / 0.8 / 3），
#   呼叫點適配見 FORK.md §2。
sfv = "0.15"
rand = "0.10"
ahash = { workspace = true }
unicase = "2"
brotli = "8"
openssl-probe = "0.1.6"
tokio-test = "0.4"
zstd = "0"
httpdate = "1"
# ★ 樞衡 fork §1（G30，2026-08-20）：上游是 `"0.16.0"`，脫字號自帶 `<0.17`，而 instant-acme 要 `^0.18`
#   ⇒ 不抬，產物裡就是兩份 x509-parser，`tests/vendor/run.sh` 的 [2/5] 會判紅並拒絕跑測試。
x509-parser = { version = "0.18.1", optional = true }
ouroboros = { version = "0.18.4", optional = true }
lru = { workspace = true, optional = true }
daggy = "0.8"

[target.'cfg(unix)'.dependencies]
flurry = "0.5"
daemonix = "0.1.0"
nix = { version = "~0.31.1", features = ["socket", "net", "fs", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
h2 = { workspace = true, features = ["unstable"] }
tokio-stream = { version = "0.1", features = ["full"] }
env_logger = "0.11"
reqwest = { version = "0.12", features = [
    "rustls-tls",
    "http2",
], default-features = false }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
http-body-util = "0.1"
rstest = "0.23.0"
# Only used for types in tests; the crypto provider arrives through
# pingora-rustls, so no provider feature is selected here.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }

[[bench]]
name = "h1_pipelining"
harness = false

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = "0.9"
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { package = "tikv-jemallocator", version = "0.6" }

[features]
default = []
# ★ 樞衡 fork：上游的 openssl / s2n 兩條隨 [dependencies] 裡的宣告一起刪（理由在那裡）。
# ★ 樞衡 fork（2026-09-24，0.9.0 起）：上游新增的 dial9 / dial9-worker-s3 / dial9-cpu-profiling 三條也刪 ——
#   它們打開 pingora-runtime 的可選依賴 dial9-tokio-telemetry 與 aws-sdk-s3（那份清單裡一併刪了）。
#   vendor 鎖會記下成員 crate 的**全部**可選依賴，而 aws-sdk-s3 的預設特性經 rustls-aws-lc 拉進 aws-lc-rs
#   ⇒ crates/fulcrum/tests/supply_gates.rs 門 1（兩把鎖裡都不許出現 aws-lc-rs）當場紅。見 FORK.md。
boringssl = ["pingora-boringssl", "openssl_derived"]
rustls = ["pingora-rustls", "any_tls", "dep:x509-parser", "ouroboros"]
patched_http1 = ["pingora-http/patched_http1"]
openssl_derived = ["any_tls"]
any_tls = []
sentry = ["dep:sentry"]
connection_filter = []
