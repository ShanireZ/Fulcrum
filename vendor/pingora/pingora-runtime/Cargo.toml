[package]
name = "pingora-runtime"
version = "0.9.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "non-blocking", "pingora"]
description = """
Multithreaded Tokio runtime with the option of disabling work stealing.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# ★ 樞衡 fork §1：上游 0.8，抬到 0.10（呼叫點在 src/lib.rs，見 FORK.md §2）。
rand = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
once_cell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
thread_local = "1"
log = { workspace = true }
# ★ 樞衡 fork（2026-09-24，0.9.0 起）：上游這裡還有兩個可選依賴 dial9-tokio-telemetry 與 aws-sdk-s3，
#   連同下面 [features] 裡的 dial9 三條一起刪。vendor 鎖會記下成員 crate 的全部可選依賴，
#   而 aws-sdk-s3 的預設特性會把 aws-lc-rs 拉進鎖裡 ⇒ supply_gates.rs 門 1 當場紅。見 FORK.md。
#   原始碼裡 #[cfg(feature = "dial9…")] 的分支原樣保留，永遠不會被點亮。

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }

[[bench]]
name = "hello"
harness = false

[features]
default = []
